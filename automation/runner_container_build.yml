---
- name: Configure ML Lesson Container
  hosts: localhost
  connection: local
  gather_facts: false  # Speeds up the build process

  vars:
    # Standard libraries available on PyPI
    standard_packages:
      - numpy
      - pandas
      - scikit-learn
      - matplotlib
      - seaborn
    
    # Kaggle's tools are best installed directly from their source
    kaggle_packages:
      - "git+https://github.com/Kaggle/learntools.git"

  tasks:
    - name: Update pip to latest version
      pip:
        name: pip
        state: latest
        extra_args: --break-system-packages

    - name: Install Standard ML Dependencies
      pip:
        name: "{{ standard_packages }}"
        state: present
        extra_args: --no-cache-dir --break-system-packages

    - name: Install Kaggle Learntools (from Git)
      pip:
        name: "{{ kaggle_packages }}"
        state: present
        extra_args: --no-cache-dir --break-system-packages --no-build-isolation

    - name: Create working and data directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - ./work
        - ./data